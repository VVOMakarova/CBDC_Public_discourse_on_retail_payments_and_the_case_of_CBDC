<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дайджест — Архитектура денег</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const RUBRICS = [
  { emoji: "🌍", name: "CBDC · Страновые проекты" },
  { emoji: "⚖️", name: "Регулирование и право" },
  { emoji: "🔗", name: "Токенизация активов (RWA)" },
  { emoji: "🌐", name: "Межгосударственные расчёты" },
  { emoji: "🏦", name: "Монетарная политика и ЦБ" },
  { emoji: "💻", name: "Технологическая инфраструктура" },
  { emoji: "💱", name: "Стейблкоины" },
  { emoji: "📊", name: "Финансовая инклюзия" },
  { emoji: "🔐", name: "Конфиденциальность и безопасность" },
  { emoji: "🇷🇺", name: "Российский контекст и СНГ" },
  { emoji: "🏢", name: "Корпоративный блокчейн и финтех" },
  { emoji: "📚", name: "Исследования и аналитика" },
  { emoji: "💡", name: "Образование и просвещение" },
];

const RUBRIC_NAMES = RUBRICS.map(r => r.name);

function buildPrompt() {
  const today = new Date().toLocaleDateString("ru-RU", {
    day: "numeric", month: "long", year: "numeric", weekday: "long"
  });

  return `Сегодня ${today}.

Ты — редакционный ассистент канала «Архитектура денег» (@cbdc_monitor).
Канал о CBDC, токенизации и цифровой финансовой инфраструктуре. Аудитория — профессионалы: экономисты, финансисты, регуляторы.

ЗАДАЧА: найди в интернете свежие новости за последние 24–48 часов по темам канала и составь утренний дайджест.

ЧТО ИСКАТЬ (сделай несколько поисковых запросов):

- CBDC news today 2025
- tokenization RWA news today
- stablecoin regulation news
- mBridge cross-border payment news
- digital euro update
- BIS central bank digital currency
- цифровой рубль новости
- digital asset regulation 2025

РУБРИКИ для классификации:
${RUBRIC_NAMES.map((n, i) => `${i + 1}. ${n}`).join("\n")}

ПРАВИЛА:

- Найди 8–12 реально существующих статей с реальными URL
- Для каждой выбери одну рубрику из списка выше (точное название)
- Важность 1–5: 5=прорыв, 4=значимо, 3=полезно, 2=фоново, 1=нерелевантно
- Включай только важность ≥ 3
- «why» — одна строка по-русски, почему важно для аудитории канала
- URL должны быть реальными рабочими ссылками на статьи

ВЕРНИ СТРОГО JSON без преамбулы, без markdown-блоков. Первый символ — [

[
  {
    "title": "заголовок статьи на языке оригинала",
    "url": "https://…",
    "source": "название источника",
    "rubric": "точное название рубрики из списка",
    "importance": 4,
    "why": "одна строка по-русски — почему важно для читателей канала"
  }
]`;
}

async function fetchDigest(apiKey) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      messages: [{ role: "user", content: buildPrompt() }],
    }),
  });
  if (!response.ok) {
    const body = await response.text().catch(() => "");
    throw new Error(`API error ${response.status}${body ? ": " + body : ""}`);
  }
  const data = await response.json();
  const textBlock = [...data.content].reverse().find(b => b.type === "text");
  if (!textBlock) throw new Error("Нет текстового ответа от модели");
  const raw = textBlock.text.trim();
  const match = raw.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("Не удалось извлечь JSON из ответа");
  return JSON.parse(match[0]);
}

function Stars({ n }) {
  return (
    <span style={{ letterSpacing: 1, fontSize: 12 }}>
      {Array.from({ length: 5 }, (_, i) => (
        <span key={i} style={{ color: i < n ? "#c9a84c" : "#d1c5a8" }}>★</span>
      ))}
    </span>
  );
}

function RubricEmoji({ name }) {
  const r = RUBRICS.find(r => r.name === name);
  return <span>{r ? r.emoji : "📌"}</span>;
}

const IMPORTANCE_LABEL = { 5: "прорыв", 4: "значимо", 3: "полезно" };

const LOADING_MSGS = [
  "Ищу свежие новости по CBDC и токенизации…",
  "Проверяю BIS, Atlantic Council, Ledger Insights…",
  "Классифицирую по рубрикам канала…",
  "Собираю дайджест…",
];

function ApiKeyGate({ onKey }) {
  const [val, setVal] = useState("");
  return (
    <div style={{
      textAlign: "center",
      padding: "60px 20px",
      background: "#fff",
      borderRadius: 12,
      border: "1px solid rgba(201,168,76,0.25)",
    }}>
      <div style={{ fontSize: 40, marginBottom: 16 }}>🔑</div>
      <div style={{ fontFamily: "'PT Serif', serif", fontSize: 20, color: "#0f1f3d", marginBottom: 8 }}>
        Введите Anthropic API-ключ
      </div>
      <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 20, maxWidth: 380, margin: "0 auto 20px" }}>
        Ключ используется только в этом браузере и не сохраняется на сервере.
      </div>
      <input
        type="password"
        placeholder="sk-ant-..."
        value={val}
        onChange={e => setVal(e.target.value)}
        onKeyDown={e => e.key === "Enter" && val.startsWith("sk-") && onKey(val)}
        style={{
          width: "100%", maxWidth: 360,
          padding: "10px 14px",
          border: "1.5px solid rgba(201,168,76,0.4)",
          borderRadius: 8,
          fontSize: 14,
          fontFamily: "monospace",
          outline: "none",
          marginBottom: 12,
          display: "block",
          margin: "0 auto 12px",
        }}
      />
      <button
        onClick={() => val.startsWith("sk-") && onKey(val)}
        disabled={!val.startsWith("sk-")}
        style={{
          background: val.startsWith("sk-") ? "#c9a84c" : "rgba(201,168,76,0.3)",
          color: "#0f1f3d",
          border: "none",
          borderRadius: 8,
          padding: "10px 24px",
          fontWeight: 800,
          fontSize: 13,
          cursor: val.startsWith("sk-") ? "pointer" : "not-allowed",
        }}
      >
        Продолжить →
      </button>
    </div>
  );
}

export default function DigestAgent() {
  const [apiKey, setApiKey] = useState("");
  const [status, setStatus] = useState("idle");
  const [items, setItems] = useState([]);
  const [error, setError] = useState("");
  const [loadMsg, setLoadMsg] = useState("");
  const [savedItems, setSavedItems] = useState({});

  async function run() {
    setStatus("loading");
    setItems([]);
    setError("");
    setSavedItems({});
    let i = 0;
    setLoadMsg(LOADING_MSGS[0]);
    const interval = setInterval(() => {
      i = (i + 1) % LOADING_MSGS.length;
      setLoadMsg(LOADING_MSGS[i]);
    }, 4000);

    try {
      const data = await fetchDigest(apiKey);
      const filtered = data.filter(d => d.importance >= 3);
      setItems(filtered);
      setStatus("done");
    } catch (e) {
      setError(e.message);
      setStatus("error");
    } finally {
      clearInterval(interval);
    }
  }

  const grouped = {};
  for (const item of items) {
    if (!grouped[item.rubric]) grouped[item.rubric] = [];
    grouped[item.rubric].push(item);
  }
  const sortedGroups = Object.entries(grouped).sort(
    ([, a], [, b]) => Math.max(...b.map(x => x.importance)) - Math.max(...a.map(x => x.importance))
  );

  const today = new Date().toLocaleDateString("ru-RU", {
    day: "numeric", month: "long", weekday: "short"
  });

  const css = `
    @import url('https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f0e8; }
    a { color: #0f1f3d; text-decoration: none; }
    a:hover { text-decoration: underline; color: #c9a84c; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
  `;

  return (
    <div style={{ fontFamily: "'Manrope', sans-serif", minHeight: "100vh", background: "#f5f0e8", padding: 0 }}>
      <style>{css}</style>

      {/* Header */}
      <div style={{
        background: "#0f1f3d",
        borderBottom: "2px solid #c9a84c",
        padding: "18px 28px",
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        flexWrap: "wrap",
        gap: 12,
      }}>
        <div>
          <a href="index.html" style={{ textDecoration: "none" }}>
            <div style={{ fontFamily: "'PT Serif', serif", color: "#c9a84c", fontSize: 20, fontWeight: 700, letterSpacing: 0.3 }}>
              Архитектура денег
            </div>
          </a>
          <div style={{ color: "rgba(255,255,255,0.45)", fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", marginTop: 2 }}>
            @cbdc_monitor · редакционный дайджест
          </div>
        </div>

        {apiKey && (
          <button
            onClick={run}
            disabled={status === "loading"}
            style={{
              background: status === "loading" ? "rgba(201,168,76,0.3)" : "#c9a84c",
              color: "#0f1f3d",
              border: "none",
              borderRadius: 8,
              padding: "10px 22px",
              fontFamily: "'Manrope', sans-serif",
              fontSize: 13,
              fontWeight: 800,
              cursor: status === "loading" ? "not-allowed" : "pointer",
              letterSpacing: "0.04em",
              transition: "all 0.2s",
              display: "flex",
              alignItems: "center",
              gap: 8,
            }}
          >
            {status === "loading" ? (
              <>
                <span style={{ animation: "spin 1s linear infinite", display: "inline-block" }}>⟳</span>
                Ищу…
              </>
            ) : (
              <>📋 Собрать дайджест</>
            )}
          </button>
        )}
      </div>

      <div style={{ maxWidth: 780, margin: "0 auto", padding: "24px 20px" }}>

        {/* API key gate */}
        {!apiKey && <ApiKeyGate onKey={setApiKey} />}

        {/* Idle state */}
        {apiKey && status === "idle" && (
          <div style={{
            textAlign: "center",
            padding: "60px 20px",
            background: "#fff",
            borderRadius: 12,
            border: "1px solid rgba(201,168,76,0.25)",
          }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>📰</div>
            <div style={{ fontFamily: "'PT Serif', serif", fontSize: 22, color: "#0f1f3d", marginBottom: 8 }}>
              Утренний дайджест
            </div>
            <div style={{ fontSize: 13.5, color: "#6b7280", lineHeight: 1.7, maxWidth: 400, margin: "0 auto 24px" }}>
              Нажми кнопку — Claude найдёт свежие новости по CBDC, токенизации и цифровой финансовой инфраструктуре и классифицирует их по рубрикам канала.
            </div>
            <div style={{ fontSize: 12, color: "#9ca3af" }}>Поиск занимает ~30–60 секунд</div>
          </div>
        )}

        {/* Loading state */}
        {status === "loading" && (
          <div style={{
            textAlign: "center",
            padding: "60px 20px",
            background: "#fff",
            borderRadius: 12,
            border: "1px solid rgba(201,168,76,0.25)",
          }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔍</div>
            <div style={{ fontFamily: "'PT Serif', serif", fontSize: 18, color: "#0f1f3d", marginBottom: 10 }}>
              Собираю дайджест
            </div>
            <div style={{ fontSize: 13, color: "#c9a84c", fontWeight: 600 }}>{loadMsg}</div>
            <div style={{ marginTop: 20, display: "flex", justifyContent: "center", gap: 6 }}>
              {[0, 1, 2].map(i => (
                <div key={i} style={{
                  width: 8, height: 8, borderRadius: "50%", background: "#c9a84c",
                  animation: `pulse 1.2s ease-in-out ${i * 0.2}s infinite`,
                }} />
              ))}
            </div>
          </div>
        )}

        {/* Error */}
        {status === "error" && (
          <div style={{
            background: "#fff5f5",
            border: "1px solid #fca5a5",
            borderRadius: 12,
            padding: "24px",
            textAlign: "center",
          }}>
            <div style={{ fontSize: 32, marginBottom: 10 }}>⚠️</div>
            <div style={{ fontWeight: 700, color: "#991b1b", marginBottom: 8 }}>Не удалось собрать дайджест</div>
            <div style={{ fontSize: 12.5, color: "#7f1d1d", fontFamily: "monospace", wordBreak: "break-all" }}>{error}</div>
            <button onClick={run} style={{
              marginTop: 16, padding: "8px 20px", background: "#0f1f3d", color: "#c9a84c",
              border: "none", borderRadius: 6, cursor: "pointer", fontWeight: 700, fontSize: 13
            }}>Повторить</button>
          </div>
        )}

        {/* Results */}
        {status === "done" && items.length > 0 && (
          <>
            <div style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              marginBottom: 20,
              flexWrap: "wrap",
              gap: 8,
            }}>
              <div>
                <div style={{ fontFamily: "'PT Serif', serif", fontSize: 20, color: "#0f1f3d" }}>
                  Дайджест · {today}
                </div>
                <div style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>
                  {items.length} материалов · {sortedGroups.length} рубрик
                </div>
              </div>
              <button onClick={run} style={{
                padding: "7px 16px", background: "transparent", border: "1.5px solid #c9a84c",
                color: "#0f1f3d", borderRadius: 6, cursor: "pointer", fontSize: 12, fontWeight: 700
              }}>Обновить ↺</button>
            </div>

            {sortedGroups.map(([rubric, rubricItems]) => (
              <div key={rubric} style={{
                background: "#fff",
                borderRadius: 12,
                border: "1px solid rgba(201,168,76,0.2)",
                marginBottom: 16,
                overflow: "hidden",
              }}>
                <div style={{
                  background: "#0f1f3d",
                  padding: "10px 18px",
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                }}>
                  <RubricEmoji name={rubric} />
                  <span style={{ color: "#c9a84c", fontWeight: 800, fontSize: 13, letterSpacing: "0.04em" }}>
                    {rubric}
                  </span>
                  <span style={{
                    marginLeft: "auto",
                    background: "rgba(201,168,76,0.2)",
                    color: "#c9a84c",
                    fontSize: 11,
                    fontWeight: 700,
                    padding: "2px 8px",
                    borderRadius: 10,
                  }}>
                    {rubricItems.length}
                  </span>
                </div>

                <div style={{ padding: "6px 0" }}>
                  {rubricItems
                    .sort((a, b) => b.importance - a.importance)
                    .map((item, idx) => (
                      <div key={idx} style={{
                        padding: "14px 18px",
                        borderBottom: idx < rubricItems.length - 1 ? "1px solid #f5f0e8" : "none",
                        display: "flex",
                        gap: 14,
                        alignItems: "flex-start",
                      }}>
                        <div style={{ flexShrink: 0, width: 36, paddingTop: 2, textAlign: "center" }}>
                          <Stars n={item.importance} />
                          <div style={{
                            fontSize: 9,
                            fontWeight: 700,
                            textTransform: "uppercase",
                            letterSpacing: "0.06em",
                            color: item.importance === 5 ? "#c9a84c" : "#9ca3af",
                            marginTop: 3,
                          }}>
                            {IMPORTANCE_LABEL[item.importance] || ""}
                          </div>
                        </div>

                        <div style={{ flex: 1, minWidth: 0 }}>
                          <a
                            href={item.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            style={{
                              fontWeight: 700,
                              fontSize: 14,
                              color: "#0f1f3d",
                              lineHeight: 1.45,
                              display: "block",
                              marginBottom: 5,
                            }}
                          >
                            {item.title}
                          </a>
                          <div style={{
                            fontSize: 12.5,
                            color: "#6b7280",
                            fontStyle: "italic",
                            lineHeight: 1.55,
                            marginBottom: 6,
                          }}>
                            {item.why}
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                            <span style={{
                              fontSize: 11,
                              fontWeight: 700,
                              color: "#0f1f3d",
                              background: "#f5f0e8",
                              padding: "2px 8px",
                              borderRadius: 4,
                            }}>
                              {item.source}
                            </span>
                            <a
                              href={item.url}
                              target="_blank"
                              rel="noopener noreferrer"
                              style={{ fontSize: 11, color: "#c9a84c", fontWeight: 600 }}
                            >
                              Читать →
                            </a>
                            <button
                              onClick={() => setSavedItems(s => ({ ...s, [item.url]: !s[item.url] }))}
                              style={{
                                marginLeft: "auto",
                                background: "none",
                                border: "none",
                                cursor: "pointer",
                                fontSize: 16,
                                opacity: savedItems[item.url] ? 1 : 0.35,
                                transition: "opacity 0.2s",
                                padding: 0,
                              }}
                              title={savedItems[item.url] ? "В работе" : "Взять в работу"}
                            >
                              {savedItems[item.url] ? "📌" : "📎"}
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            ))}

            {Object.values(savedItems).some(Boolean) && (
              <div style={{
                background: "#0f1f3d",
                borderRadius: 10,
                padding: "14px 18px",
                marginTop: 8,
              }}>
                <div style={{ color: "#c9a84c", fontWeight: 800, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.07em", marginBottom: 8 }}>
                  📌 Взято в работу ({Object.values(savedItems).filter(Boolean).length})
                </div>
                {items
                  .filter(item => savedItems[item.url])
                  .map((item, i) => (
                    <div key={i} style={{ color: "rgba(255,255,255,0.8)", fontSize: 12.5, marginBottom: 4 }}>
                      <a href={item.url} target="_blank" rel="noopener noreferrer"
                        style={{ color: "#e8c97a", textDecoration: "none" }}>
                        {item.title}
                      </a>
                    </div>
                  ))}
              </div>
            )}

            <div style={{
              textAlign: "center",
              color: "#9ca3af",
              fontSize: 12,
              marginTop: 20,
              paddingTop: 16,
              borderTop: "1px solid rgba(201,168,76,0.15)",
            }}>
              Агент собрал. Ты решаешь. · «Архитектура денег»
            </div>
          </>
        )}

        {/* Empty results */}
        {status === "done" && items.length === 0 && (
          <div style={{
            textAlign: "center",
            padding: "48px 20px",
            background: "#fff",
            borderRadius: 12,
            border: "1px solid rgba(201,168,76,0.2)",
          }}>
            <div style={{ fontSize: 36, marginBottom: 12 }}>☁️</div>
            <div style={{ fontWeight: 700, color: "#0f1f3d", marginBottom: 6 }}>Сегодня тихо</div>
            <div style={{ fontSize: 13, color: "#6b7280" }}>Свежих новостей по рубрикам канала не найдено</div>
            <button onClick={run} style={{
              marginTop: 16, padding: "8px 20px", background: "#0f1f3d", color: "#c9a84c",
              border: "none", borderRadius: 6, cursor: "pointer", fontWeight: 700, fontSize: 13
            }}>Попробовать снова</button>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DigestAgent />);
</script>
</body>
</html>
